  <style>
    :root {
      --color-text: #333;
      --color-accent: #e60000;
      --header-height: 80px; 
      --font-principal: 'Roboto', sans-serif;
      --rojo: #c0392b;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: rgba(0,0,0,0.08);
      --bg: #ffffff;
      --shadow: 0 2px 12px rgba(0,0,0,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    section { scroll-margin-top: var(--header-height); }

    body { 
      margin: 0; 
      font-family: var(--font-principal); 
      color: var(--color-text); 
      overflow-x: hidden; 
      line-height: 1.6; 
      background: var(--bg);
      min-height: 100vh;
    }

    h1, h2 {
      font-family: var(--font-principal);
      font-weight: 300;
      font-size: 42px;
      color: var(--color-accent);
      margin: 0 0 30px 40px;          
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    @media (min-width: 900px) {
      h1, h2 {
        letter-spacing: 5px;
        transform: scaleY(1.2);
        display: inline-block;
        transform-origin: left;
      }
    }

    .site-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 40px; 
      background: #fff; 
      position: sticky; 
      top: 0; 
      z-index: 2000; 
      height: var(--header-height); 
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
    }

    .site-header a img { 
      height: 60px; 
      display: block;
    }
    
    nav#nav-escritorio { 
      display: flex; 
      gap: 20px; 
      align-items: center; 
      height: 100%;        
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: #555;
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      transition: color 0.3s ease;
      background: none;
      border: none;
      padding: 0 5px;
    }
    
    .nav-button:hover { color: var(--color-accent); }
    .nav-button img { display: none; }

    .menu-hamburguesa {
      display: none;
      font-size: 28px;
      color: var(--color-accent);
      cursor: pointer;
      z-index: 2100;
    }

    .hero { max-width: 860px; margin: 3.5rem auto 2rem; padding: 0 2rem; }
    .hero-title { font-size: clamp(32px, 5vw, 48px); color: var(--rojo); margin-bottom: 1.5rem; }

    .filters-wrap { max-width: 860px; margin: 0 auto 2.5rem; padding: 0 2rem; display: flex; gap: 10px; flex-wrap: wrap; }
    .chip { font-size: 12px; padding: 8px 18px; border-radius: 50px; border: 1px solid rgba(0,0,0,0.12); cursor: pointer; background: white; transition: all 0.3s ease; color: var(--muted); font-family: var(--font-principal); }
    .chip:hover { border-color: var(--rojo); color: var(--rojo); }
    .chip.active { background: var(--rojo); color: #fff; border-color: var(--rojo); }

    .grid-wrap { max-width: 860px; margin: 0 auto; padding: 0 2rem 5rem; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

    .card { background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .22s; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; height: 410px; color: var(--text); }
    .card:hover { transform: scale(1.05); }

    .card-img { width: 100%; height: 110px; flex-shrink: 0; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    
    .card-body { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 50px; }
    .card-title { font-size: 13px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; color: #111; }
    
    .card-cats-box { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .card-cat-tag { font-size: 9px; color: var(--rojo); font-style: italic; }
    .card-cat-tag:not(:last-child)::after { content: " •"; }

    .card-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }

    .card-footer, .modal-footer { position: absolute; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 8px; }
    .card-footer { height: 45px; }
    .modal-footer { height: 60px; }

    .label-saber { color: var(--rojo); font-size: 10px; font-weight: 700; letter-spacing: 0.5px; margin-right: 4px; }
    .icon-link { height: 22px; width: auto; vertical-align: middle; transition: transform 0.2s; }
    .icon-link:hover { transform: scale(1.2); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; width: 500px; height: 85vh; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .modal-img { width: 100%; height: 300px; flex-shrink: 0; }
    .modal-img img { width: 100%; height: 100%; object-fit: cover; }
    .modal-content { flex-grow: 1; padding: 25px; padding-bottom: 80px; display: flex; flex-direction: column; min-height: 0; position: relative; }
    .modal-header { flex-shrink: 0; display: flex; justify-content: space-between; margin-bottom: 15px; }
    .modal-title { font-size: 22px; font-weight: 700; line-height: 1.2; color: #111; }
    .modal-cats-list { font-size: 13px; color: var(--rojo); font-style: italic; }
    .modal-close { cursor: pointer; font-size: 26px; color: var(--muted); line-height: 1; }
    .modal-scroll-area { overflow-y: auto; flex-grow: 1; padding-right: 10px; }
    .modal-scroll-area::-webkit-scrollbar { width: 4px; }
    .modal-scroll-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
    .modal-desc { font-size: 14.5px; line-height: 1.7; color: var(--muted); }

    @media (max-width: 900px) {
      .menu-hamburguesa { 
        display: block; 
        position: absolute; 
        right: 20px; 
        top: 25px; 
      }

      nav#nav-escritorio {
        display: none;
        flex-direction: column;
        position: fixed;
        top: var(--header-height);
        left: 0;
        width: 100%;
        background: #ffffff;
        padding: 20px;
        gap: 12px;
        align-items: flex-start;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        z-index: 9999;
      }

      nav#nav-escritorio.show { display: flex; }
      .grid { grid-template-columns: 1fr; }
      .modal { width: 90%; height: 90vh; }
    }
  </style>
</head>

      enlace.addEventListener('click', function() {
        navEscritorio.classList.remove('show');
      });
    });

function getLinksHtml(links) {
  if (!links || links.length === 0) return '';
  let html = '<span class="label-saber">SABER MÁS:</span>';
  links.forEach(function(link) {
    const icon = link.type === 'blog' ? 'icon-blog' : 'icon-' + link.type;
    html += '<a href="' + link.url + '" target="_blank" onclick="event.stopPropagation()">' +
            '<img src="./' + icon + '.png" class="icon-link">' +
            '</a>';
  });
  return html;
}

function renderCards(filterCat) {
  filterCat = filterCat || "Todas";
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const filtered = projects.filter(function(p) {
    return filterCat === "Todas" || p.categories.includes(filterCat);
  });
  filtered.forEach(function(p) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-img"><img src="' + p.img + '"></div>' +
      '<div class="card-body">' +
        '<div class="card-title">' + p.title + '</div>' +
        '<div class="card-cats-box">' + p.categories.map(function(c) { return '<span class="card-cat-tag">' + c + '</span>'; }).join('') + '</div>' +
        '<div class="card-desc">' + p.resumen + '</div>' +
      '</div>' +
      '<div class="card-footer">' + getLinksHtml(p.links) + '</div>';
    card.onclick = function() { openModal(p); };
    grid.appendChild(card);
  });
}

function openModal(p) {
  document.getElementById('m-img').innerHTML = '<img src="' + p.img + '">';
  document.getElementById('m-title').innerText = p.title;
  document.getElementById('m-cats').innerText = p.categories.join(' • ');
  document.getElementById('m-desc').innerText = p.literal;
  document.getElementById('m-footer').innerHTML = getLinksHtml(p.links);
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

document.querySelectorAll('.chip').forEach(function(chip) {
  chip.onclick = function() {
    document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
    this.classList.add('active');
    renderCards(this.dataset.cat);
  };
});

document.getElementById('overlay').onclick = function(e) {
  if (e.target.id === 'overlay') closeModal();
};

renderCards();
</script>
