<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} | Blog Juanjo Vergara</title>
    <style>
        /* ESTILOS BASE */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fcfcfc;
            color: #333333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* BANNER SUPERIOR: Botones grises semitransparentes */
        .banner-botones {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
            background-color: #fcfcfc;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            width: 100%;
        }

        .banner-botones a {
            display: inline-block;
            background-color: rgba(0, 0, 0, 0.25);
            color: #333333 !important;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background-color 0.2s ease;
        }

        .banner-botones a:hover {
            background-color: rgba(0, 0, 0, 0.35);
        }

        /* CONTENEDOR DEL ARTÍCULO */
        .post-container {
            max-width: 650px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .post-category {
            font-size: 0.85rem;
            color: #e06666;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            color: #111111;
            margin-top: 0;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .post-date {
            font-size: 0.9rem;
            color: #888888;
            margin-bottom: 30px;
        }

        /* CUERPO DEL POST: Texto perfectamente justificado */
        .post-body {
            font-size: 1.1rem;
            color: #444444;
            text-align: justify;
        }

        .post-body p {
            margin-bottom: 20px;
        }

        /* DISEÑO DE LA IMAGEN DEL POST */
        .post-image {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 30px;
            display: block;
        }

        /* BOTÓN VOLVER ATRÁS */
        .btn-volver {
            display: inline-block;
            margin-top: 40px;
            color: #e06666;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="banner-botones">
        <a href="https://juanjovergara.wixsite.com/juanjo/blog-1" target="_blank">Visitar blog anterior</a>
        
        <a href="https://socioculturalesbb.blogspot.com/">Ver post anteriores</a>
    </div>

    <div class="post-container">
        <div class="post-category">{{category}}</div>
        <h1>{{title}}</h1>
        <div class="post-date">{{date}}</div>
        
        {{#if image}}
        <img src=".{{image}}" class="post-image" alt="{{title}}">
        {{/if}}

        <div class="post-body">
            {{{body}}}
        </div>

        <a href="/blog/" class="btn-volver">← Volver al listado del blog</a>
    </div>

</body>
</html>
